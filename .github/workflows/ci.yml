name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is included because it is what a current local venv gets, and
        # `requires-python` has no upper bound.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # node24-based majors. v4/v5 ran on Node 20, which GitHub force-migrated to
      # Node 24 and reported as a deprecation warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the dependency set is self-consistent
        # Would have surfaced the `[google]` extra being unsatisfiable next to
        # mootdx's `httpx>=0.25,<0.26` pin, and any newly broken transitive pin.
        run: pip check

      - name: Run tests
        env:
          # Tests are offline: tests/conftest.py stubs every provider client and
          # blocks outbound sockets. These placeholders only keep accidental
          # client construction from blocking on an interactive prompt.
          OPENAI_API_KEY: placeholder
          DEEPSEEK_API_KEY: placeholder
        # `tests/` also enforces the repository's own consistency:
        #   test_docs_consistency.py  — README/CLAUDE/NOTICE/licence vs the code
        #   test_example_artifacts.py — no committed report ships price levels
        #
        # The tee/publish dance: downloading a job log needs repository admin
        # rights, so a red build is otherwise just "exit code 1" to anyone
        # outside. `::error::` lines are rendered as annotations, and annotations
        # are readable with the public checks API — so the failure tail is
        # republished in a form that can actually be seen.
        run: |
          set -o pipefail
          # `set +e` around the pipeline is load-bearing: Actions runs bash with
          # `-e`, so a failing pytest would abort the script before the publish
          # block below ever executed — and the annotations are the whole point.
          set +e
          pytest tests/ -q 2>&1 | tee /tmp/pytest.log
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::pytest exited with status $status"
            tail -n 12 /tmp/pytest.log | grep -v '^$' | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Confirm nothing is left uncollected at the repository root
        # The root used to ship `test_astock.py` / `test.py` / `test_data_quality.py`
        # with live billed LLM calls at module level, so pytest collection itself
        # spent money. They are manual probes under scripts/ now.
        run: |
          if ls test_*.py 2>/dev/null; then
            echo "::error::root-level test_*.py found; move manual probes to scripts/"
            exit 1
          fi
