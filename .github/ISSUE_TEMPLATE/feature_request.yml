name: Feature request
description: 提出一个功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不方便，或缺少什么能力
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议做法
      description: 你希望它如何工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（可选）
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 是否涉及数据源、时点纪律、Agent 输入输出契约或许可
