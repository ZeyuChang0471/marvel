[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marvel"
version = "0.2.13"
description = "MARVEL — Multi-Agent Research & Valuation Engine for Long-short（A股多Agent投研框架）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Mixed: Apache-2.0 + PolyForm-Noncommercial-1.0.0 (non-commercial use only) — see LICENSING.md"}
authors = [
    {name = "ZeyuChang0471", email = "ZeyuChang0471@users.noreply.github.com"},
]
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "streamlit>=1.45.0",
    "fpdf2>=2.8.0",
    "python-dotenv>=1.1.0",
    "mootdx>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/ZeyuChang0471/marvel"
Repository = "https://github.com/ZeyuChang0471/marvel"
Issues = "https://github.com/ZeyuChang0471/marvel/issues"
Upstream = "https://github.com/TauricResearch/TradingAgents"
Upstream-Astock = "https://github.com/simonlin1212/tradingagents-astock"

[project.optional-dependencies]
google = ["langchain-google-genai>=4.0.0"]
dev = [
    "pytest>=8.0",
]

[project.scripts]
marvel = "cli.main:app"
marvel-web = "web.launch:main"

[tool.setuptools.packages.find]
include = ["marvel*", "cli*", "web*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
