[build-system]
# PEP 639 (SPDX license expressions + `license-files`) needs setuptools>=77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marvel-astock"
version = "0.2.14"
description = "MARVEL — Multi-Agent Research & Valuation Engine for Long-short（A股多Agent投研框架）"
readme = "README.md"
requires-python = ">=3.10"
# SPDX expression, not free text (PEP 639). `AND` = both sets of terms apply to
# the distribution, which is what LICENSING.md says: the code inherited through
# the fork chain stays Apache-2.0 (and every recipient keeps Apache's
# irrevocable, commercially-usable grant), while the files taken from
# KylinMountain/TradingAgents-AShare are PolyForm-Noncommercial-1.0.0. Because a
# PolyForm component is present, the distribution as a whole is non-commercial.
# The per-component breakdown lives in LICENSING.md and NOTICE — a machine
# readable field cannot express it, so it must not pretend to.
license = "Apache-2.0 AND PolyForm-Noncommercial-1.0.0"
license-files = [
    "LICENSE",
    "LICENSE-TradingAgents-AShare.txt",
    "NOTICE",
    "LICENSING.md",
]
authors = [
    {name = "ZeyuChang0471", email = "ZeyuChang0471@users.noreply.github.com"},
]
keywords = ["a-share", "stock", "multi-agent", "llm", "research", "valuation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Listed from an audit of what the code actually imports. Do not add a
# dependency here without an import to back it — and do not rely on a
# transitive pin to supply one (pydantic and python-dateutil were both being
# imported without being declared).
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "streamlit>=1.45.0",
    "fpdf2>=2.8.0",
    "python-dotenv>=1.1.0",
    "mootdx>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/ZeyuChang0471/marvel"
Repository = "https://github.com/ZeyuChang0471/marvel"
Issues = "https://github.com/ZeyuChang0471/marvel/issues"
Upstream = "https://github.com/TauricResearch/TradingAgents"
Upstream-Astock = "https://github.com/simonlin1212/tradingagents-astock"

[project.optional-dependencies]
# NOTE: there is deliberately no `google` extra.
#
# langchain-google-genai needs `httpx>=0.28.1` while mootdx pins
# `httpx>=0.25,<0.26` (mootdx 0.11.7 METADATA), so an extra declaring it would
# be unsatisfiable next to the core dependency set — pip could not resolve it,
# and CI never installed it, so it silently rotted. `marvel/llm_clients/
# google_client.py` raises an ImportError explaining the conflict and giving the
# working install commands instead:
#
#   pip install --no-deps "langchain-google-genai>=4.0.0"
#   pip install "google-genai>=1.53.0" "httpx>=0.28.1"
#
# (mootdx speaks TDX over TCP and does not import httpx at runtime, so bumping
# httpx is safe in practice.) Reinstating an extra requires resolving that pin.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    # `tomllib` is stdlib only from Python 3.11 (PEP 680); the docs-consistency
    # test parses pyproject.toml, so 3.10 needs the backport.
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
marvel = "cli.main:app"
marvel-web = "web.launch:main"

[tool.setuptools.packages.find]
include = ["marvel*", "cli*", "web*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Lint / coverage
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["venv", ".pytest_tmp", "tmp*", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
# 先只开确定性最强的规则：语法错误、未定义名、未使用导入/变量。
# 格式类规则（E501、I、UP）等代码稳定后再逐步加。
select = ["E4", "E7", "E9", "F"]
# E402：入口脚本与探针有意在 sys.path / load_dotenv 之后再导入项目模块。
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# 这些模块是 re-export hub：导入本身就是对外 API。
"**/__init__.py" = ["F401"]
"marvel/agents/utils/agent_utils.py" = ["F401"]
"marvel/dataflows/alpha_vantage.py" = ["F401"]
"web/theme.py" = ["F401"]
# 两个文件的 star import 是既有的装配方式，重构前先允许。
"cli/main.py" = ["F403", "F405"]
"marvel/graph/setup.py" = ["F403", "F405"]
"marvel/graph/trading_graph.py" = ["F403", "F405"]

[tool.coverage.run]
source = ["marvel", "web", "cli"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
