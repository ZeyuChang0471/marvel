services:
  marvel:
    build: .
    env_file:
      - .env
    volumes:
      - marvel_data:/home/appuser/.marvel
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  marvel-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - marvel_data:/home/appuser/.marvel
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  marvel_data:
  ollama_data:
